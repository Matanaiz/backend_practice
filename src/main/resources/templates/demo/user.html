<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Demo</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
        .message { color: green; font-weight: bold; margin-bottom: 16px; }
        .switch { margin-top: 16px; }
        .switch a { margin-right: 12px; }
    </style>
</head>
<body>
    <h1>User Demo</h1>

    <p class="message" th:text="${message}"></p>

    <table>
        <tr><th>ID</th><td th:text="${user.id}"></td></tr>
        <tr><th>Username</th><td th:text="${user.username}"></td></tr>
        <tr><th>Display Name</th><td th:text="${user.displayName}"></td></tr>
        <tr><th>Role</th><td th:text="${user.role}"></td></tr>
        <tr><th>Status</th><td th:text="${user.status}"></td></tr>
    </table>

    <form method="get" th:action="@{/demo/user/page}">
        <label>Username: <input type="text" name="username" th:value="${user.username}"></label>
        <button type="submit">查询</button>
    </form>

    <div class="switch">
        <span>切换用户：</span>
        <a th:href="@{/demo/user/page(username='alice')}">alice</a>
        <a th:href="@{/demo/user/page(username='bob')}">bob</a>
    </div>
</body>
</html>
